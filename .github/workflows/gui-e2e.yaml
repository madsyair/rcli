on:
  push:
    branches: [main, master]
  pull_request:

name: gui-e2e

permissions: read-all

jobs:
  gui-e2e:
    # end-to-end tests of the Shiny interface in headless Chrome; macOS
    # runners come with Google Chrome installed
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RCLI_E2E: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinytest2, any::chromote, any::pkgload, local::., RJDemetra=?ignore
          needs: check
      - name: Browser tests
        run: |
          options(testthat.progress.max_fails = 100)
          res <- testthat::test_local(".", filter = "app-e2e",
                                      stop_on_failure = TRUE)
          print(res)
        shell: Rscript {0}
